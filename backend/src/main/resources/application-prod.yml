# Production profile — runs on a Hostinger VPS under Dokploy, with MySQL as a
# container in the same stack. Every value here is sourced from an environment
# variable with NO fallback default, so the app fails fast on startup instead of
# silently running with a wrong/insecure value. Set these in the Dokploy service's
# Environment tab (see infra/README.md):
#
#   SPRING_DATASOURCE_URL       jdbc:mysql://mysql:3306/twisted_momos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   CORS_ALLOWED_ORIGINS        https://<your-vercel-domain>
#   JWT_SECRET                  a long, random, high-entropy string (32+ bytes) — never reuse the dev value
#
# If a managed database ever replaces the MySQL container, only these four
# datasource values change — no code or migration changes required.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    # No default: the base file falls back to localhost, which would put a dead
    # link in every verification email.
    frontend-base-url: ${FRONTEND_BASE_URL}
  notification:
    # No default either. An absent key silently swaps in the logging adapter, so
    # registrations would succeed while no one ever receives a link.
    api-key: ${RESEND_API_KEY}
    from-email: ${NOTIFICATION_FROM_EMAIL}

logging:
  level:
    com.twistedmomos.backend: INFO
    org.hibernate.SQL: WARN
  # One JSON object per line. ECS emits trace.id/span.id as first-class fields,
  # which CloudWatch Logs Insights discovers automatically — so a request is
  # queryable with `filter trace.id = "..."` and no regex parse step.
  # Dev deliberately stays human-readable text; see application-dev.yml.
  structured:
    format:
      console: ecs

# Hardcoded false, not env-var-sourced. The no-defaults rule in this file exists
# so a *missing* value fails fast; false is already the fail-safe state here, and
# parameterising it would let a stray env var switch the docs on in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
