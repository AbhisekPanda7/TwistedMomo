spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: true
  jpa:
    # Open-in-view is Boot's default but is deliberately turned off here: it
    # silently keeps a DB session open for the whole request behind a filter
    # ordering that isn't guaranteed relative to other filters (e.g. our JWT
    # filter runs before it), and it invites accidental N+1 queries in views.
    # Every association a request needs is fetched explicitly instead
    # (see UserRepository.findByEmail's join fetch).
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          # Off, and stated explicitly rather than left to the default. Flyway
          # owns every table in this schema (V7 creates the two Modulith needs).
          # Modulith would back off when they already exist, but "backs off"
          # depends on initializer-vs-Flyway ordering at startup; forbidding it
          # outright is one less thing to reason about during an incident.
          enabled: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    info:
      # Answers "which build is actually running?" in one request. Deploys have
      # silently no-opped before — a webhook Dokploy declined with a 200, and a
      # cached :latest — and both were invisible until behaviour was inspected.
      access: read-only
  info:
    # The repository is public, so a commit id discloses nothing that is not
    # already readable on GitHub.
    git:
      mode: simple
    build:
      enabled: true
  tracing:
    sampling:
      # Boot's default is 0.1. Sampling gates whether a span is *recorded and
      # exported*, and there is no exporter here yet — so 0.1 would buy nothing
      # while risking log lines with no traceId. Every request is traced so that
      # every log line is queryable. Revisit when spans actually ship somewhere
      # (X-Ray/OTLP), where volume and per-trace cost start to matter.
      probability: 1.0
  otlp:
    metrics:
      export:
        # The OpenTelemetry starter is here for trace/span IDs in logs, but it
        # also switches on an OTLP *metrics* registry that pushes to
        # localhost:4318 every minute. Nothing listens there, so it would retry
        # and fail forever. Turn it on deliberately alongside a collector.
        enabled: false

# Comma-separated list of origins allowed to call this API (no trailing slashes).
# dev  -> local Vite dev server(s)
# prod -> the deployed Vercel frontend domain, set via CORS_ALLOWED_ORIGINS on Render
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
  jwt:
    # app.jwt.secret is intentionally NOT set here — see application-dev.yml
    # (safe fallback) and application-prod.yml (required, no fallback).
    access-token-expiration-ms: 900000 # 15 minutes
    refresh-token-expiration-ms: 2592000000 # 30 days
  upload:
    # Local disk. NOTE: on Render this does NOT survive a redeploy (ephemeral
    # filesystem) — fine for now, swap FileStorageService for S3-compatible
    # object storage before this matters in production.
    dir: ${UPLOAD_DIR:./uploads}

  auth:
    # Verification links point at the SPA, not the API.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  notification:
    # Absent in dev, so LoggingNotificationSender takes over and no Resend
    # account is needed locally. Set RESEND_API_KEY to send for real.
    api-key: ${RESEND_API_KEY:}
    from-name: ${NOTIFICATION_FROM_NAME:Twisted Momos}
    from-email: ${NOTIFICATION_FROM_EMAIL:noreply@twistedmomos.tech}
  google:
    # Not a secret — it ships in the frontend bundle. It is the audience every
    # Google ID token is checked against, so a wrong value rejects every sign-in.
    client-id: ${GOOGLE_CLIENT_ID}
