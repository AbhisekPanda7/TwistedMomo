# Local development profile — targets a MySQL instance on your machine.
# Override any of these via environment variables; nothing here should be
# used in production.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/twisted_momos_dev?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Dev-only fallback so the app runs out of the box. Never used in prod —
    # see application-prod.yml, which requires JWT_SECRET with no default.
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-this-needs-to-be-at-least-32-bytes-long-for-hs256}

logging:
  level:
    com.twistedmomos.backend: DEBUG

management:
  endpoint:
    health:
      show-details: always
