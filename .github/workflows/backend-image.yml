# Builds the backend image. Does NOT deploy — see release.yml.
#
# A merge to main produces a candidate tagged :<sha> and nothing more. Deploying
# is a separate, human-approved act, so this workflow deliberately does not push
# :latest: Dokploy pulls :latest, and moving it here would put an unreviewed
# image one redeploy away from production.
#
# The production host never builds anything; it pulls an image whose tests have
# already passed. The runner never connects to the VPS.

name: backend image

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the repository name is mixed case.
  IMAGE_NAME: abhisekpanda7/twistedmomo-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The suite is Mockito-only and needs no database, so it gates the build
      # rather than running against a deployed container.
      - name: Run tests
        working-directory: backend
        run: ./mvnw -B test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          # The VPS is x86. Matching it exactly keeps the build fast; add
          # linux/arm64 only if the host architecture changes.
          platforms: linux/amd64
          # No :latest here — that tag is what Dokploy pulls, and release.yml is
          # the only thing allowed to move it. :sha is kept alongside the version
          # so a build can always be traced back to its commit.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Built \`v0.0.${{ github.run_number }}\`"
            echo ""
            echo "Commit \`${{ github.sha }}\` — **not deployed**."
            echo ""
            echo "Deploy it with the **release backend** workflow, version \`v0.0.${{ github.run_number }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
