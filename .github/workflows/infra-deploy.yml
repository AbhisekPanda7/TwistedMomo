# Redeploys the stack after a compose change. No build: a change to compose.yml
# needs the current images re-applied, not new ones.
#
# This exists because compose-only changes had no way to reach production. The
# frontend healthcheck fix in 3ca357d was committed and then sat undeployed for
# three hours while the container reported unhealthy — the repo was right and
# production was stale, with nothing to reconcile them. Run this after merging a
# compose change.

name: infra deploy

# Manual only. A compose change lands on main with the merge, but applying it to
# production is a separate decision — compose edits often need a matching
# environment-variable change in the Dokploy UI first, and firing automatically
# would deploy the new file against the old variables.
on:
  workflow_dispatch:

# Must match the group in release.yml — see the comment there for why these two
# workflows share one lock.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Same approval gate as release.yml — this changes production.
    environment: production
    steps:
      # The Dokploy panel is tailnet-only, so the webhook host does not resolve
      # from a stock runner. See release.yml for why this is preferable to
      # exposing the panel publicly.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Dokploy reads compose from its own configured git source, so this
      # workflow only signals it to re-pull. Anything that must change inside
      # Dokploy's environment variables is still a manual edit in its UI.
      - name: Trigger Dokploy redeploy
        run: |
          curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            || { echo "Dokploy webhook failed"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### Infra redeploy triggered"
            echo ""
            echo "Compose changes in \`${{ github.sha }}\` applied to production."
            echo ""
            echo "Verify the running config actually changed:"
            echo '```'
            echo "docker inspect --format '{{json .Config.Healthcheck}}' <container>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
