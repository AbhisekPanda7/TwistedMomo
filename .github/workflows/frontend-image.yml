# Builds the frontend image. Does NOT deploy — see release.yml. Mirrors
# backend-image.yml; kept as a separate workflow so a frontend change does not
# rebuild the API and vice versa.
#
# Version numbers come from this workflow's own run counter, so frontend and
# backend versions advance independently and are not comparable to each other.

name: frontend image

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase path; the repository name is mixed case.
  IMAGE_NAME: abhisekpanda7/twistedmomo-frontend
  # Compiled into the bundle at build time — Vite does not read this at runtime,
  # so it lives here rather than in the Dokploy environment.
  API_BASE_URL: https://api.twistedmomos.tech/api/v1
  # Same reason as above: build-time, so Dokploy cannot supply it. A repo variable
  # rather than a secret — the value is public in the shipped JavaScript — but it
  # must match the GOOGLE_CLIENT_ID the backend checks against, or every sign-in
  # is rejected as the wrong audience. Set at Settings -> Secrets and variables
  # -> Actions -> Variables.
  GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `npm run build` runs `tsc -b` first, so this is the type check as well.
      - name: Build
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # An unset variable would build a bundle with no client id: the Google button
      # simply would not render, with nothing in the logs to say why.
      - name: Require the Google client id
        run: |
          if [ -z "${{ env.GOOGLE_CLIENT_ID }}" ]; then
            echo "::error::GOOGLE_CLIENT_ID repository variable is not set."
            echo "Set it at Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
          # No :latest here — that tag is what Dokploy pulls, and release.yml is
          # the only thing allowed to move it. :sha is kept alongside the version
          # so a build can always be traced back to its commit.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v0.0.${{ github.run_number }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Built \`v0.0.${{ github.run_number }}\`"
            echo ""
            echo "Commit \`${{ github.sha }}\` — **not deployed**."
            echo ""
            echo "Deploy it with the **release frontend** workflow, version \`v0.0.${{ github.run_number }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
