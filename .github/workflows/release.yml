# Promotes an already-built image to production.
#
# The build workflows push :v0.0.N and :<sha> but never :latest. This workflow is
# the only thing that moves :latest, which is the tag Dokploy pulls — so nothing
# reaches production without passing through the approval gate below.
#
# Promotion is a retag by digest, not a rebuild: the image that ships is bit
# for bit the one that was tested. A rebuild could pick up a moved base image or
# a changed dependency and quietly differ from what was approved.

name: release

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to release'
        required: true
        type: choice
        options:
          - backend
          - frontend
      version:
        description: 'Version to promote, e.g. v0.0.43 (see the package tag list)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

# Shared with infra-deploy.yml: both fire the same Dokploy webhook, which
# recreates the entire stack. Without a common group these two workflows cannot
# see each other — GitHub scopes concurrency per workflow by default — so an
# infra redeploy and a release approved seconds apart would both hit Dokploy
# mid-pull. Renaming this group in one file silently unpairs them.
#
# This queues the second run rather than cancelling it: a release that has
# already moved :latest must still reach the webhook, or production stays on the
# old image with no indication anything was skipped.
#
# Note this bounds GitHub jobs, not Dokploy. The webhook is fire-and-forget —
# curl returns when Dokploy accepts the request, not when the pull settles — so
# a webhook can still land while a previous deploy is converging.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Blocks here until a required reviewer approves, before any step runs.
    # NOTE: this only gates if the `production` environment has required
    # reviewers configured in repo settings. Without them it runs straight
    # through — the gate fails open, silently.
    environment: production
    permissions:
      contents: write   # create the git tag
      packages: write   # retag in GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: img
        run: |
          case "${{ inputs.service }}" in
            backend)  echo "name=abhisekpanda7/twistedmomo-backend"  >> "$GITHUB_OUTPUT" ;;
            frontend) echo "name=abhisekpanda7/twistedmomo-frontend" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown service: ${{ inputs.service }}" >&2; exit 1 ;;
          esac

      - name: Validate version format
        run: |
          if ! printf '%s' "${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like v0.0.43, got '${{ inputs.version }}'" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fail with a readable message rather than letting the retag below error
      # out on a missing manifest. A typo'd version is the likely cause.
      - name: Verify the build exists
        id: verify
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          if ! docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}" > /dev/null 2>&1; then
            echo "No image $IMAGE:${{ inputs.version }} in GHCR." >&2
            echo "Check the package tag list for a version that was actually built." >&2
            exit 1
          fi
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:${{ inputs.version }}" \
            --format '{{println .Manifest.Digest}}' | head -1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Promoting $IMAGE:${{ inputs.version }} ($DIGEST)"

      - name: Point :latest at this version
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.img.outputs.name }}"
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            "$IMAGE:${{ inputs.version }}"

      # The Dokploy panel is bound to the Tailscale interface and firewalled off
      # the public internet, so the webhook host does not resolve from a stock
      # runner. Joining the tailnet is what makes it reachable without exposing
      # the panel — which holds every environment variable in plaintext.
      #
      # The node is ephemeral and tagged: it removes itself when the job ends,
      # and tag:ci is scoped in the ACL to port 3000 on the prod host only —
      # not SSH, not Grafana.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy redeploy
        # The webhook URL is a secret: anyone holding it can trigger a deploy.
        # Dokploy pulls :latest, which now resolves to the promoted digest.
        #
        # One webhook per stack, so this recreates every container — releasing
        # the backend restarts the frontend too. That is safe: only this workflow
        # moves :latest, so the other service redeploys the same image it was
        # already running. Per-service restarts would need a webhook per Dokploy
        # service, which is not worth the extra configuration at this size.
        run: |
          # The ref is required, not decorative: Dokploy matches it against the
          # branch configured on the service, and a bare POST carries none — so
          # it answers 200 with {"message":"Branch Not Match"} and deploys
          # nothing. curl -f only inspects the status, so that refusal read as
          # success and left production several releases behind with no red
          # build to show it. Hence both the payload and the body check.
          RESPONSE=$(curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{"ref":"refs/heads/main"}') \
            || { echo "::error::Dokploy webhook request failed"; exit 1; }

          echo "Dokploy responded: $RESPONSE"

          case "$RESPONSE" in
            *"Not Match"*|*"error"*|*"Error"*|*"unauthorized"*|*"Unauthorized"*)
              echo "::error::Dokploy refused the redeploy: $RESPONSE"
              echo "The image was promoted but nothing was deployed."
              exit 1
              ;;
          esac

      # Tagged per service: backend and frontend version independently, so a
      # bare v0.0.43 would be ambiguous about which one shipped.
      #
      # Runs after the webhook, and cannot fail the job. This used to sit before
      # it, and a rollback to backend-v0.0.2 stranded production: :latest had
      # already moved, the tag push failed, and the webhook never fired — so the
      # registry said v0.0.2 while the running container was still v0.0.3.
      # Tagging is bookkeeping and must never gate a deploy.
      - name: Tag the release in git
        continue-on-error: true
        run: |
          TAG="${{ inputs.service }}-${{ inputs.version }}"
          # Check the remote, not the local clone: actions/checkout does not
          # fetch tags, so `git rev-parse` never found an existing release tag
          # and this fell through to a push the remote then rejected. Promoting
          # an already-tagged version is normal — that is what a rollback is.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists — skipping tag creation."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release ${{ inputs.service }} ${{ inputs.version }}"
            git push origin "$TAG"
          fi

      - name: Summary
        run: |
          {
            echo "### Released ${{ inputs.service }} \`${{ inputs.version }}\`"
            echo ""
            echo "Digest: \`${{ steps.verify.outputs.digest }}\`"
            echo ""
            echo "\`:latest\` now points here; Dokploy redeploy triggered."
            echo ""
            echo "Rollback: run this workflow again with an earlier version."
            echo ""
            echo "Rolling back moves \`:latest\` only — it does not revert \`main\`,"
            echo "so the next release ships over it."
          } >> "$GITHUB_STEP_SUMMARY"
